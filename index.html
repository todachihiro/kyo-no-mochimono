
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#172b4d">
<title>パパにおまかせ！朝の支度</title>

<style>
:root {
  --navy: #172b4d;
  --navy2: #263f65;
  --yellow: #ffd447;
  --bg: #f3f6fa;
  --white: #fff;
  --text: #202c3c;
  --muted: #718096;
  --green: #23865b;
  --border: #e1e7ef;
}
* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont,
    "Noto Sans JP", "Yu Gothic", Meiryo, sans-serif;
}

header {
  background: var(--navy);
  color: white;
  padding: 24px 16px;
  text-align: center;
}
header h1 {
  font-size: 24px;
  margin: 0;
}
header p {
  color: #dce5f1;
  font-size: 13px;
  margin: 9px 0 0;
}

main {
  max-width: 650px;
  margin: auto;
  padding: 16px 14px 45px;
}

.today {
  text-align: center;
  color: var(--muted);
  font-size: 14px;
  margin: 4px 0 16px;
}

.child-tabs {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 9px;
  margin-bottom: 15px;
}
.child-tab {
  background: white;
  border: 2px solid var(--border);
  color: var(--navy);
  border-radius: 14px;
  padding: 14px 8px;
  font-size: 17px;
  font-weight: 900;
  cursor: pointer;
}
.child-tab.active {
  background: var(--navy);
  color: white;
  border-color: var(--navy);
}

.profile-area {
  margin-bottom: 16px;
}
.profile-toggle {
  width: 100%;
  padding: 12px;
  border: 1px solid var(--border);
  border-radius: 11px;
  background: white;
  color: var(--navy);
  font-size: 14px;
  font-weight: 800;
  cursor: pointer;
}
.profile-panel {
  display: none;
  background: white;
  padding: 15px;
  border-radius: 12px;
  margin-top: 8px;
}
.profile-panel.open { display: block; }

label {
  display: block;
  font-size: 13px;
  font-weight: 800;
  color: var(--navy);
  margin: 9px 0 5px;
}
input, textarea, select {
  width: 100%;
  border: 1px solid #d5dce6;
  border-radius: 10px;
  padding: 12px;
  font-size: 16px;
  background: white;
  color: var(--text);
  font-family: inherit;
}
textarea {
  resize: vertical;
  min-height: 60px;
}
input[type="number"] { min-width: 0; }

.icon-options {
  display: flex;
  gap: 9px;
  margin-top: 7px;
}
.icon-option {
  width: 48px;
  height: 48px;
  border: 2px solid var(--border);
  background: white;
  border-radius: 12px;
  font-size: 24px;
  cursor: pointer;
}
.icon-option.selected {
  border-color: var(--yellow);
  background: #fff8df;
}

.progress-card {
  background: white;
  border-radius: 16px;
  padding: 16px;
  margin-bottom: 16px;
  box-shadow: 0 2px 8px #172b4d0c;
}
.progress-top {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  font-weight: 900;
  color: var(--navy);
}
.progress-track {
  height: 12px;
  background: #e8edf3;
  border-radius: 20px;
  overflow: hidden;
  margin-top: 12px;
}
.progress-fill {
  height: 100%;
  width: 0;
  background: var(--yellow);
  border-radius: 20px;
  transition: width .25s;
}

.section-title {
  font-size: 17px;
  color: var(--navy);
  font-weight: 900;
  margin: 22px 2px 10px;
}

.add-box {
  background: #fff9e5;
  border: 1px solid #f2d77a;
  border-radius: 16px;
  padding: 15px;
  margin-bottom: 16px;
}
.add-box h2 {
  font-size: 16px;
  margin: 0 0 12px;
  color: var(--navy);
}
.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.form-row.three {
  grid-template-columns: 65px 1fr 80px;
}
.primary-btn, .secondary-btn, .danger-btn {
  border: 0;
  border-radius: 11px;
  padding: 13px 15px;
  font-size: 15px;
  font-weight: 900;
  cursor: pointer;
}
.primary-btn {
  background: var(--yellow);
  color: var(--navy);
}
.secondary-btn {
  background: #e8edf4;
  color: var(--navy);
}
.danger-btn {
  background: #fff0ef;
  color: #b43d37;
}
.full { width: 100%; }

.item-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.item-card {
  background: white;
  border: 2px solid var(--border);
  border-radius: 16px;
  padding: 13px;
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 10px;
  align-items: center;
  box-shadow: 0 2px 7px #172b4d08;
}
.item-card.done {
  background: #f0f8f4;
  border-color: #b9dfca;
}
.item-main { min-width: 0; }
.item-name {
  font-size: 19px;
  font-weight: 900;
  color: var(--navy);
  display: flex;
  align-items: center;
  gap: 7px;
  overflow-wrap: anywhere;
}
.item-card.done .item-name {
  color: #668174;
}
.item-hint {
  font-size: 13px;
  color: #53647a;
  margin-top: 7px;
  line-height: 1.55;
  overflow-wrap: anywhere;
}
.hint-label {
  font-weight: 900;
  color: #8b6b14;
}
.quantity-text {
  font-size: 12px;
  color: var(--muted);
  margin-top: 5px;
}
.check-btn {
  width: 66px;
  height: 66px;
  border: 2px solid #dce3ec;
  background: #f8fafc;
  border-radius: 15px;
  color: var(--navy);
  font-size: 27px;
  font-weight: 900;
  cursor: pointer;
}
.done .check-btn {
  background: var(--green);
  color: white;
  border-color: var(--green);
}
.card-actions {
  display: flex;
  gap: 7px;
  margin-top: 9px;
}
.small-btn {
  border: 0;
  border-radius: 7px;
  background: #edf1f6;
  color: #53647a;
  padding: 7px 10px;
  font-size: 12px;
  cursor: pointer;
}

.empty {
  background: white;
  border-radius: 14px;
  padding: 25px 15px;
  text-align: center;
  color: var(--muted);
}

.complete-box {
  display: none;
  background: var(--navy);
  color: white;
  border-radius: 18px;
  padding: 23px 17px;
  text-align: center;
  margin-top: 18px;
}
.complete-box.show { display: block; }
.trophy { font-size: 46px; }
.complete-box h2 {
  font-size: 23px;
  margin: 8px 0;
}
.complete-box p {
  line-height: 1.6;
  font-size: 14px;
  color: #e0e8f2;
}
.report-text {
  background: white;
  color: var(--navy);
  border-radius: 10px;
  padding: 12px;
  margin: 13px 0;
  font-weight: 900;
  font-size: 14px;
}
.report-buttons {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.reset-area {
  text-align: center;
  margin-top: 22px;
}
.reset-btn {
  border: 0;
  background: transparent;
  color: #788598;
  text-decoration: underline;
  padding: 10px;
  font-size: 13px;
  cursor: pointer;
}

.transfer-box {
  background: white;
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 16px;
  margin-top: 25px;
}
.transfer-box h2 {
  font-size: 17px;
  margin: 0 0 8px;
  color: var(--navy);
}
.transfer-box p {
  font-size: 13px;
  line-height: 1.6;
  color: var(--muted);
  margin: 0 0 13px;
}
.transfer-buttons {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.transfer-note {
  font-size: 11px;
  color: var(--muted);
  margin-top: 10px;
}
footer {
  text-align: center;
  color: #9aa5b3;
  font-size: 11px;
  padding: 15px;
}

@media(max-width:380px) {
  header h1 { font-size: 21px; }
  .item-name { font-size: 17px; }
  .check-btn { width: 58px; height: 58px; }
  .transfer-buttons { grid-template-columns: 1fr; }
}
</style>
</head>

<body>

<header>
  <h1>🧢 パパにおまかせ！</h1>
  <p>画面の通りに準備するだけ。朝の支度チェック</p>
</header>

<main>

  <div class="today" id="todayText"></div>

  <div class="child-tabs" id="childTabs"></div>

  <section class="profile-area">
    <button class="profile-toggle" onclick="toggleProfile()">
      ⚙️ 子どもの設定を開く
    </button>
    <div class="profile-panel" id="profilePanel">
      <label>子どもの名前</label>
      <input id="profileName" maxlength="20" placeholder="名前を入力">

      <label>アイコン</label>
      <div class="icon-options" id="iconOptions">
        <button class="icon-option" onclick="setIcon('👦')">👦</button>
        <button class="icon-option" onclick="setIcon('👧')">👧</button>
        <button class="icon-option" onclick="setIcon('🧒')">🧒</button>
      </div>

      <button class="primary-btn full" style="margin-top:13px"
        onclick="saveProfile()">設定を保存</button>
    </div>
  </section>

  <section class="progress-card">
    <div class="progress-top">
      <span>今日の準備進捗</span>
      <span id="progressText">0 / 0 完了</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </section>

  <section class="add-box">
    <h2>⚡ 臨時の持ち物を追加</h2>

    <input id="newName" maxlength="50"
      placeholder="例：お弁当、体操服など">

    <div class="form-row">
      <input id="newPlace" maxlength="100"
        placeholder="収納場所">
      <input id="newNote" maxlength="150"
        placeholder="注意点・準備のヒント">
    </div>

    <div class="form-row three">
      <input id="newEmoji" maxlength="4" value="🎒"
        aria-label="アイコン">
      <input id="newQuantity" type="number" min="1" max="99" value="1"
        aria-label="数量">
      <input id="newUnit" maxlength="10" value="個"
        aria-label="単位">
    </div>

    <button class="primary-btn full" onclick="addItem()">
      ＋ 持ち物を追加する
    </button>
  </section>

  <h2 class="section-title" id="listTitle">📋 持ち物リスト</h2>
  <div class="item-list" id="itemList"></div>

  <section class="complete-box" id="completeBox">
    <div class="trophy">🏆</div>
    <h2>任務完了！完璧な準備です！</h2>
    <p>すべての持ち物を確認しました。<br>
      今日の朝の支度はこれでバッチリです！</p>
    <div class="report-text" id="reportText"></div>
    <div class="report-buttons">
      <button class="primary-btn" onclick="copyReport()">
        📋 報告をコピー
      </button>
      <button class="secondary-btn" onclick="shareReport()">
        📤 LINEなどで共有
      </button>
    </div>
  </section>

  <div class="reset-area">
    <button class="reset-btn" onclick="resetChild()">
      ↻ この子のチェックをすべてリセット
    </button>
  </div>

  <section class="transfer-box">
    <h2>📦 設定の引き継ぎ</h2>
    <p>
      2人分の名前・アイコン・持ち物・収納場所・注意点を
      ファイルにまとめて、パパのスマホへ送れます。
      チェック状態は引き継がれません。
    </p>

    <div class="transfer-buttons">
      <button class="primary-btn" onclick="exportSettings()">
        📤 設定を書き出す
      </button>
      <button class="secondary-btn" onclick="chooseImport()">
        📥 設定を読み込む
      </button>
    </div>

    <input type="file" id="importFile"
      accept=".json,application/json"
      style="display:none" onchange="importSettings(event)">

    <div class="transfer-note">
      ※ LINEなどでJSONファイルを送受信できます。外部サーバーへの保存はありません。
    </div>
  </section>

</main>

<footer>
  毎日の持ち物準備を、もっと簡単に。
</footer>

<script>
const STORAGE_KEY = "papa-morning-check-v2";

function initialData() {
  return {
    children: [
      {
        name: "こども1",
        icon: "👦",
        items: [
          {
            id: makeId(),
            name: "水筒",
            emoji: "🥤",
            place: "キッチンの棚",
            note: "麦茶を入れる",
            quantity: 1,
            unit: "本",
            count: 0
          },
          {
            id: makeId(),
            name: "連絡帳",
            emoji: "📒",
            place: "テーブルの上",
            note: "ママのサインを確認",
            quantity: 1,
            unit: "冊",
            count: 0
          },
          {
            id: makeId(),
            name: "上履き",
            emoji: "👟",
            place: "玄関のシューズボックス上",
            note: "名前が書いてあるか確認",
            quantity: 1,
            unit: "足",
            count: 0
          }
        ]
      },
      {
        name: "こども2",
        icon: "👧",
        items: [
          {
            id: makeId(),
            name: "水筒",
            emoji: "🥤",
            place: "キッチンの棚",
            note: "麦茶を入れる",
            quantity: 1,
            unit: "本",
            count: 0
          },
          {
            id: makeId(),
            name: "連絡帳",
            emoji: "📒",
            place: "テーブルの上",
            note: "ママのサインを確認",
            quantity: 1,
            unit: "冊",
            count: 0
          },
          {
            id: makeId(),
            name: "上履き",
            emoji: "👟",
            place: "玄関のシューズボックス上",
            note: "名前が書いてあるか確認",
            quantity: 1,
            unit: "足",
            count: 0
          }
        ]
      }
    ]
  };
}

function makeId() {
  return "id-" + Date.now() + "-" +
    Math.random().toString(36).slice(2);
}

function normalizeItem(item) {
  return {
    id: makeId(),
    name: String(item.name || "持ち物"),
    emoji: String(item.emoji || "🎒"),
    place: String(item.place || ""),
    note: String(item.note || ""),
    quantity: Math.max(1, Math.min(99, Number(item.quantity) || 1)),
    unit: String(item.unit || "個"),
    count: Math.max(0, Math.min(
      Number(item.quantity) || 1,
      Number(item.count) || 0
    ))
  };
}

function loadData() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const parsed = JSON.parse(saved);
      if (parsed.children && parsed.children.length === 2) {
        parsed.children = parsed.children.map(child => ({
          name: String(child.name || "こども"),
          icon: String(child.icon || "🧒"),
          items: Array.isArray(child.items)
            ? child.items.map(normalizeItem)
            : []
        }));
        return parsed;
      }
    }
  } catch (e) {}
  return initialData();
}

let data = loadData();
let activeChild = 0;
let selectedIcon = data.children[0].icon;

function saveData() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#039;"
  })[char]);
}

function todayText() {
  const d = new Date();
  const weekdays = ["日","月","火","水","木","金","土"];
  document.getElementById("todayText").textContent =
    `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日（${weekdays[d.getDay()]}）`;
}

function render() {
  todayText();

  const child = data.children[activeChild];

  document.getElementById("childTabs").innerHTML =
    data.children.map((c, i) => `
      <button class="child-tab ${i === activeChild ? "active" : ""}"
        onclick="selectChild(${i})">
        ${escapeHTML(c.icon)} ${escapeHTML(c.name)}
      </button>
    `).join("");

  document.getElementById("listTitle").textContent =
    `📋 ${child.name}の持ち物`;

  document.getElementById("profileName").value = child.name;
  selectedIcon = child.icon;
  renderIconOptions();

  const items = child.items;
  const total = items.reduce((sum, item) => sum + item.quantity, 0);
  const done = items.reduce((sum, item) => sum + item.count, 0);
  const percent = total ? Math.round(done / total * 100) : 0;

  document.getElementById("progressText").textContent =
    `${done} / ${total} 完了`;

  document.getElementById("progressFill").style.width =
    percent + "%";

  const sorted = [...items].sort((a, b) =>
    Number(a.count >= a.quantity) - Number(b.count >= b.quantity)
  );

  document.getElementById("itemList").innerHTML = sorted.length
    ? sorted.map(item => {
        const completed = item.count >= item.quantity;
        return `
          <article class="item-card ${completed ? "done" : ""}">
            <div class="item-main">
              <div class="item-name">
                ${escapeHTML(item.emoji)}
                ${escapeHTML(item.name)}
              </div>

              <div class="item-hint">
                <div>
                  <span class="hint-label">📍 場所：</span>
                  ${escapeHTML(item.place || "未設定")}
                </div>
                ${item.note ? `
                  <div>
                    <span class="hint-label">💡 注意：</span>
                    ${escapeHTML(item.note)}
                  </div>
                ` : ""}
              </div>

              <div class="quantity-text">
                ${completed ? "確認完了！" :
                  `確認数：${item.count} / ${item.quantity}${escapeHTML(item.unit)}`}
              </div>

              <div class="card-actions">
                <button class="small-btn"
                  onclick="editItem('${item.id}')">✏️ 編集</button>
                <button class="small-btn"
                  onclick="deleteItem('${item.id}')">削除</button>
              </div>
            </div>

            <button class="check-btn"
              aria-label="確認数を変更"
              onclick="toggleItem('${item.id}')">
              ${completed ? "✓" : "+"}
            </button>
          </article>
        `;
      }).join("")
    : `<div class="empty">
        持ち物はまだありません。<br>
        上から追加できます。
      </div>`;

  const allDone = total > 0 && done === total;
  document.getElementById("completeBox")
    .classList.toggle("show", allDone);

  document.getElementById("reportText").textContent =
    `準備完了しました！（持ち物${total}点すべて確認済み）`;
}

function selectChild(index) {
  activeChild = index;
  render();
}

function toggleProfile() {
  document.getElementById("profilePanel")
    .classList.toggle("open");
}

function renderIconOptions() {
  document.querySelectorAll(".icon-option").forEach(button => {
    button.classList.toggle(
      "selected",
      button.textContent.trim() === selectedIcon
    );
  });
}

function setIcon(icon) {
  selectedIcon = icon;
  renderIconOptions();
}

function saveProfile() {
  const name = document.getElementById("profileName").value.trim();

  if (!name) {
    alert("名前を入力してください。");
    return;
  }

  data.children[activeChild].name = name;
  data.children[activeChild].icon = selectedIcon;

  saveData();
  render();
  document.getElementById("profilePanel").classList.remove("open");
  alert("子どもの設定を保存しました。");
}

function addItem() {
  const name = document.getElementById("newName").value.trim();
  const place = document.getElementById("newPlace").value.trim();
  const note = document.getElementById("newNote").value.trim();
  const emoji = document.getElementById("newEmoji").value.trim() || "🎒";
  const quantity = Math.max(1, Math.min(
    99, Number(document.getElementById("newQuantity").value) || 1
  ));
  const unit = document.getElementById("newUnit").value.trim() || "個";

  if (!name) {
    alert("持ち物の名前を入力してください。");
    return;
  }

  data.children[activeChild].items.push({
    id: makeId(),
    name, emoji, place, note, quantity, unit,
    count: 0
  });

  document.getElementById("newName").value = "";
  document.getElementById("newPlace").value = "";
  document.getElementById("newNote").value = "";
  document.getElementById("newEmoji").value = "🎒";
  document.getElementById("newQuantity").value = "1";
  document.getElementById("newUnit").value = "個";

  saveData();
  render();
}

function toggleItem(id) {
  const item = data.children[activeChild].items
    .find(item => item.id === id);

  if (!item) return;

  if (item.count >= item.quantity) {
    item.count = 0;
  } else {
    item.count++;
  }

  saveData();
  render();
}

function editItem(id) {
  const item = data.children[activeChild].items
    .find(item => item.id === id);

  if (!item) return;

  const name = prompt("持ち物の名前", item.name);
  if (name === null) return;
  if (!name.trim()) {
    alert("名前を入力してください。");
    return;
  }

  const place = prompt("収納場所・置いてある場所", item.place);
  if (place === null) return;

  const note = prompt("注意点・準備するときのヒント", item.note);
  if (note === null) return;

  const quantityText = prompt("必要な数量", item.quantity);
  if (quantityText === null) return;

  const quantity = Number(quantityText);
  if (!Number.isInteger(quantity) || quantity < 1 || quantity > 99) {
    alert("数量は1〜99の整数で入力してください。");
    return;
  }

  const unit = prompt("単位（個・本・枚など）", item.unit);
  if (unit === null) return;

  const emoji = prompt("アイコン・絵文字", item.emoji);
  if (emoji === null) return;

  item.name = name.trim();
  item.place = place.trim();
  item.note = note.trim();
  item.quantity = quantity;
  item.unit = unit.trim() || "個";
  item.emoji = emoji.trim() || "🎒";
  item.count = Math.min(item.count, quantity);

  saveData();
  render();
}

function deleteItem(id) {
  if (!confirm("この持ち物を削除しますか？")) return;

  data.children[activeChild].items =
    data.children[activeChild].items.filter(item => item.id !== id);

  saveData();
  render();
}

function resetChild() {
  if (!confirm("この子のチェックをすべて未完了に戻しますか？")) return;

  data.children[activeChild].items.forEach(item => {
    item.count = 0;
  });

  saveData();
  render();
}

function getReport() {
  const child = data.children[activeChild];
  const total = child.items.reduce(
    (sum, item) => sum + item.quantity, 0
  );
  return `${child.name}の準備完了しました！（持ち物${total}点すべて確認済み）`;
}

async function copyReport() {
  const text = getReport();

  try {
    await navigator.clipboard.writeText(text);
    alert("報告文をコピーしました！");
  } catch (e) {
    window.prompt("こちらをコピーしてください", text);
  }
}

async function shareReport() {
  const text = getReport();

  if (navigator.share) {
    try {
      await navigator.share({ text });
    } catch (e) {}
  } else {
    await copyReport();
  }
}

/* -------------------------
   JSON設定の書き出し
------------------------- */

function exportSettings() {
  const exportData = {
    app: "papa-morning-check",
    version: 1,
    exportedAt: new Date().toISOString(),

    children: data.children.map(child => ({
      name: child.name,
      icon: child.icon,
      items: child.items.map(item => ({
        name: item.name,
        emoji: item.emoji,
        place: item.place,
        note: item.note,
        quantity: item.quantity,
        unit: item.unit
      }))
    }))
  };

  const json = JSON.stringify(exportData, null, 2);
  const blob = new Blob([json], {
    type: "application/json;charset=utf-8"
  });

  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");

  const date = new Date();
  const dateText =
    date.getFullYear() +
    String(date.getMonth()+1).padStart(2,"0") +
    String(date.getDate()).padStart(2,"0");

  link.href = url;
  link.download = `もちもの設定-${dateText}.json`;

  document.body.appendChild(link);
  link.click();
  link.remove();

  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

/* -------------------------
   JSON設定の読み込み
------------------------- */

function chooseImport() {
  document.getElementById("importFile").click();
}

function importSettings(event) {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();

  reader.onload = function() {
    try {
      const imported = JSON.parse(reader.result);

      if (
        imported.app !== "papa-morning-check" ||
        imported.version !== 1 ||
        !Array.isArray(imported.children) ||
        imported.children.length !== 2
      ) {
        throw new Error("対応していない設定ファイルです。");
      }

      const newChildren = imported.children.map(child => {
        if (
          typeof child.name !== "string" ||
          !Array.isArray(child.items)
        ) {
          throw new Error("設定ファイルの内容が正しくありません。");
        }

        return {
          name: child.name.slice(0, 20) || "こども",
          icon: ["👦","👧","🧒"].includes(child.icon)
            ? child.icon : "🧒",

          items: child.items.map(item => {
            if (
              typeof item.name !== "string" ||
              !item.name.trim()
            ) {
              throw new Error("持ち物の名前が正しくありません。");
            }

            return {
              id: makeId(),
              name: item.name.slice(0, 50),
              emoji: String(item.emoji || "🎒").slice(0, 4),
              place: String(item.place || "").slice(0, 100),
              note: String(item.note || "").slice(0, 150),
              quantity: Math.max(1, Math.min(
                99, Number(item.quantity) || 1
              )),
              unit: String(item.unit || "個").slice(0, 10),
              count: 0
            };
          })
        };
      });

      if (!confirm(
        "現在の2人分の設定を、受け取った内容に置き換えます。\n\n" +
        "・子どもの名前とアイコン\n" +
        "・持ち物リスト\n" +
        "・収納場所と注意点\n\n" +
        "チェック状態はすべて未完了になります。\n\n" +
        "読み込んでもよろしいですか？"
      )) {
        event.target.value = "";
        return;
      }

      data.children = newChildren;
      activeChild = 0;

      saveData();
      render();

      alert("設定を読み込みました！\n2人分の持ち物リストが反映されました。");

    } catch (error) {
      alert(
        "設定ファイルを読み込めませんでした。\n" +
        (error.message || "ファイルの内容を確認してください。")
      );
    }

    event.target.value = "";
  };

  reader.onerror = function() {
    alert("ファイルを読み込めませんでした。");
    event.target.value = "";
  };

  reader.readAsText(file);
}

render();
</script>
